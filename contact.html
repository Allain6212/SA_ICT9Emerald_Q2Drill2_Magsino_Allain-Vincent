<!DOCTYPE html>
<html lang="en">
<head>
 <title>Contact Hogwarts</title>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
 <link href="styles.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-sm navbar-dark bg-dark">
 <div class="container-fluid">
   <a class="navbar-brand" href="#"><img src="Logo.png" alt="Hogwarts Logo" height="50px" width=""></a>
   <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mynavbar">
     <span class="navbar-toggler-icon"></span>
   </button>

   <div class="collapse navbar-collapse" id="mynavbar">
     <ul class="navbar-nav me-auto">
       <li class="nav-item">
         <a class="nav-link" href="index.html" target="_self">Home</a>
       </li>
       <li class="nav-item">
         <a class="nav-link" href="about.html" target="_self">About Hogwarts</a>
       </li>
       <li class="nav-item">
         <a class="nav-link" href="houses.html" target="_self">Houses</a>
       </li>
       <li class="nav-item">
         <a class="nav-link active" href="contact.html" target="_self">Contact Us</a>
       </li>
     </ul>
     <form class="d-flex">
       <input class="form-control me-2" type="text" placeholder="Search">
       <button class="btn btn-warning" type="button">Search</button>
     </form>
   </div>
 </div>
</nav>

<div class="container mt-4">

 <section id="contact">
   <h2 class="text-center">Contact Hogwarts</h2>
   <p class="text-center">Have questions about our school? Send us an owl or a message!</p>

   <div class="form-container">
     <form>
       <label for="name">Your Name:</label>
       <input type="text" id="name" name="name" placeholder="Harry Potter" required>
       <br>
       <br>

       <label for="email">Your Email:</label>
       <input type="email" id="email" name="email" placeholder="wizard@example.com" required>
       <br>
       <br>

       <label>Which Hogwarts House do you belong to?</label>
       <div class="radio-group">
         <br>
         <input type="radio" id="gryffindor" name="house" value="Gryffindor" required>
         <label for="gryffindor">Gryffindor</label>

         <input type="radio" id="slytherin" name="house" value="Slytherin">
         <label for="slytherin">Slytherin</label>

         <input type="radio" id="ravenclaw" name="house" value="Ravenclaw">
         <label for="ravenclaw">Ravenclaw</label>

         <input type="radio" id="hufflepuff" name="house" value="Hufflepuff">
         <label for="hufflepuff">Hufflepuff</label>
       </div>
       <br>
       <br>

       <label>What are you interested in?</label>
       <div class="checkbox-group">
         <input type="checkbox" id="potions" name="interested" value="Potions">
         <label for="potions">Potions</label>

         <input type="checkbox" id="charms" name="interested" value="Charms">
         <label for="charms">Charms</label>

         <input type="checkbox" id="quidditch" name="interested" value="Quidditch">
         <label for="quidditch">Quidditch</label>
       </div>
       <br>
       <br>

       <label>Rate Your Hogwarts Experience:</label>
       <select name="rating" id="rating" required>
         <option value="">-Select Your Rating-</option>
         <option value="1">⭐</option>
         <option value="2">⭐⭐</option>
         <option value="3">⭐⭐⭐</option>
         <option value="4">⭐⭐⭐⭐</option>
         <option value="5">⭐⭐⭐⭐⭐</option>
       </select>
       <br>
       <br>

       <label for="Feedback">Any Questions or Feedback?</label>
       <br>
       <textarea id="Feedback" name="Feedback" placeholder="Write your message here..." required></textarea>
       <br>
       <br>

       <button type="submit" class="btn btn-warning">Send Owl Post</button>
     </form>
   </div>
 </section>

</div>

</body>
</html>
